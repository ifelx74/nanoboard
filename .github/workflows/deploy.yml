# Build the web app on every push to main and deploy it to Cloudflare Pages
# (direct upload — the project "nanoboard" must exist first, created once in
# the dashboard). Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  — custom token with Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account id (dashboard right sidebar)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist --project-name=nanoboard --branch=main
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
