<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nanoboard — Minimalist, Local-First Project Management</title>
    <meta
      name="description"
      content="nanoboard is a minimalist, open-source workspace with a Kanban board, whiteboard, calendar, and sticky notes. Fast, private, and 100% stored in your browser."
    />
    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="nanoboard — Minimalist, Local-First Workspace"
    />
    <meta
      property="og:description"
      content="Open-source Kanban board, whiteboard, calendar, and sticky notes. Fast, private, and stored locally in your browser."
    />
    <meta property="og:type" content="website" />
    <!--------------------------------------------------------------------->
    <!-- persisted theme before first paint: stored-dark users never see -->
    <!-- a flash of light. Parses the zustand-persist envelope and fails -->
    <!-- closed to light on missing, corrupt, or foreign values.         -->
    <script>
      try {
        var storedTheme = (function () {
          try {
            var raw = window.localStorage.getItem("nanoboard-theme");
            if (!raw) return "light";
            var parsed = JSON.parse(raw);
            var state =
              parsed && typeof parsed === "object" ? parsed.state : null;
            var value = state && typeof state === "object" ? state.theme : null;
            return value === "dark" || value === "light" ? value : "light";
          } catch (e) {
            return "light";
          }
        })();
        if (storedTheme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {
        /* fail closed to light */
      }
    </script>
    <style>
      html.dark {
        background-color: #0a0a0a;
        color-scheme: dark;
      }
    </style>
    <!--------------------------------------------------------------------->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
